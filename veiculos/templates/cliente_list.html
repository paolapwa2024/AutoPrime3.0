{% extends 'base.html' %}

{% load static %}

{% block title %}Clientes - AutoPrime{% endblock %}

{% block content %}
<style>
    body {
        background-image: url("{% static 'img/carros.jpg' %}");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
    }

    .conteudo-clientes {
        background-color: #ffffff;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.25);
        max-width: 1200px;
        margin-left: auto;
        margin-right: auto;
    }

    .clientes-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
    }

    .clientes-header h1 {
        margin: 0;
        font-size: 2rem;
    }

    .clientes-header .btn {
        white-space: nowrap;
        text-align: center;
        width: fit-content;
    }

    .table-responsive td .btn {
        white-space: nowrap;
    }

    .table-responsive td:last-child {
        white-space: nowrap;
    }

    @media (max-width: 768px) {
        .conteudo-clientes {
            padding: 1.5rem;
        }

        .clientes-header h1 {
            font-size: 1.75rem;
        }
    }

    @media (max-width: 400px) {
        .conteudo-clientes {
            padding: 1.2rem;
        }

        .clientes-header h1 {
            font-size: 1.5rem;
        }

        .clientes-header .btn {
            font-size: 0.75rem;
            padding: 0.4rem 0.7rem;
        }

        .table-responsive table {
            white-space: nowrap;
        }

        .table-responsive td .btn,
        .table-responsive th {
            font-size: 0.8rem;
        }
    }
</style>

<div class="conteudo-clientes">
    <div class="clientes-header">
        <h1 style="color: black;">Clientes</h1>
        <a href="{% url 'cliente_create' %}" class="btn btn-primary">+ Novo Cliente</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr><th>Nome</th><th>Telefone</th><th>Email</th><th>Ações</th></tr>
            </thead>
            <tbody>
                {% for cliente in clientes %}
                <tr>
                    <td>{{ cliente.nome }}</td>
                    <td>{{ cliente.telefone }}</td>
                    <td>{{ cliente.email }}</td>
                    <td>
                        <a href="{% url 'cliente_update' cliente.pk %}" class="btn btn-sm btn-warning">Editar</a>
                        <a href="{% url 'cliente_delete' cliente.pk %}" class="btn btn-sm btn-danger">Excluir</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
